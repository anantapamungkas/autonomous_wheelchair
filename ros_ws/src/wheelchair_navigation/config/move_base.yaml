# move_base.yaml
# Top-level move_base parameters: global planner (A*) + local planner (DWA).
#
# IMPORTANT (per project spec): the global planner is strictly configured
# for A* search on the occupancy grid:
#     use_dijkstra:  false   -> disables Dijkstra's full-cost-map expansion
#     use_grid_path: true    -> forces a grid-constrained A* search rather
#                                than the continuous-space/hybrid path option
# No hybrid path planning parameters are included, per requirements.

# ---------------------------------------------------------------------
# Global planner: global_planner/GlobalPlanner configured for A*
# ---------------------------------------------------------------------
GlobalPlanner:
  use_dijkstra: false      # false => A* heuristic search instead of Dijkstra
  use_grid_path: true      # true  => path constrained to grid connectivity (A*), not hybrid/continuous
  use_quadratic: true       # quadratic approximation for the potential calculation (standard A* companion setting)
  old_navfn_behavior: false
  allow_unknown: false      # do not plan through unexplored cells; require a fully mapped route
  planner_window_x: 0.0
  planner_window_y: 0.0
  default_tolerance: 0.3    # meters; goal tolerance if exact goal cell is occupied
  publish_potential: true
  lethal_cost: 253
  neutral_cost: 50
  cost_factor: 3.0

# ---------------------------------------------------------------------
# Local planner: dwa_local_planner/DWAPlannerROS
# ---------------------------------------------------------------------
DWAPlannerROS:
  # ---- Robot kinematic limits (indoor wheelchair -- conservative) ----
  acc_lim_x: 1.0
  acc_lim_theta: 2.0
  max_vel_x: 1.0
  min_vel_x: 0.0
  max_vel_theta: 1.2
  min_vel_theta: -1.2
  min_in_place_vel_theta: 0.3

  # ---- Goal tolerances ----
  yaw_goal_tolerance: 0.1
  xy_goal_tolerance: 0.15
  latch_xy_goal_tolerance: false

  # ---- Forward simulation ----
  sim_time: 2.0
  vx_samples: 8
  vtheta_samples: 20
  controller_frequency: 10.0

  # ---- Trajectory scoring weights ----
  path_distance_bias: 32.0
  goal_distance_bias: 20.0
  occdist_scale: 0.02
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

  # ---- Oscillation prevention ----
  oscillation_reset_dist: 0.05

# ---------------------------------------------------------------------
# move_base top-level behavior
# ---------------------------------------------------------------------
controller_frequency: 10.0
planner_frequency: 1.0
planner_patience: 5.0
controller_patience: 3.0
conservative_reset_dist: 3.0
recovery_behavior_enabled: true
clearing_rotation_allowed: true
shutdown_costmaps: false
oscillation_timeout: 10.0
oscillation_distance: 0.2
