# costmap_common.yaml
# Shared costmap settings loaded into BOTH global_costmap and local_costmap
# namespaces. Sensor configuration here is tuned for a single RPLidar A2M8
# (12 m rated max range, ~0.15-8 m reliable indoor range, 360-degree 2D scan).

robot_radius: 0.35          # wheelchair footprint approximated as a circle (m);
                              # swap for a `footprint:` polygon for a tighter fit.

transform_tolerance: 0.3     # seconds of tf staleness tolerated before a costmap warns/drops data

# ---------------------------------------------------------------------
# Obstacle layer: consumes the live /scan topic from the RPLidar A2M8.
# ---------------------------------------------------------------------
obstacle_layer:
  enabled: true
  observation_sources: laser_scan_sensor
  laser_scan_sensor:
    sensor_frame: laser
    data_type: LaserScan
    topic: /scan
    marking: true
    clearing: true
    # A2M8 practical reliable range is ~0.15 m - 8.0 m indoors; clamp
    # obstacle marking to that window to avoid noisy far-range returns.
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0
    obstacle_range: 8.0
    raytrace_range: 9.0
    inf_is_valid: false

# ---------------------------------------------------------------------
# Inflation layer: expands lethal obstacles by robot_radius + a safety
# margin so the planner keeps clearance from walls/furniture.
# ---------------------------------------------------------------------
inflation_layer:
  enabled: true
  cost_scaling_factor: 5.0    # higher = steeper cost falloff near obstacles
  inflation_radius: 0.75      # meters; robot_radius + buffer for a wheelchair's turning envelope

# ---------------------------------------------------------------------
# Static layer: only used by global_costmap (reads the map_server map).
# Harmless if included in local_costmap's common file since it is
# disabled by the local costmap's rolling-window config there.
# ---------------------------------------------------------------------
static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: true
