# costmap_global.yaml
# Global costmap: full static map + lidar obstacles + inflation, used by
# the A* global planner (see move_base.yaml) to plan the full-map path.

global_costmap:
  global_frame: map
  robot_base_frame: base_link

  update_frequency: 2.0        # Hz -- global costmap changes slowly, keep this modest
  publish_frequency: 1.0
  static_map: true              # seeded from map_server's /map
  rolling_window: false         # global costmap covers the whole known map

  plugins:
    - {name: static_layer,     type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer,   type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer,  type: "costmap_2d::InflationLayer"}
