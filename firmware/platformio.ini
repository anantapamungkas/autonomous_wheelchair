; ---------------------------------------------------------------------------
; PlatformIO project configuration file
; Target: Teensy 4.1 (dual BTS7960 drivers, quadrature encoders, IMU)
;
; NOTE ON rosserial:
;   PlatformIO's "frankjoshua/ros_lib" mirror is used here for convenience.
;   For a fully custom message set (wheelchair_msgs/EncoderHeading), regenerate
;   ros_lib against your catkin workspace with:
;       rosrun rosserial_arduino make_libraries.py <path_to_this_lib_dir>
;   and commit the generated headers instead of relying on the community
;   mirror, so firmware and ROS message definitions never drift apart.
; ---------------------------------------------------------------------------
[env:teensy41]
platform    = teensy
board       = teensy41
framework   = arduino

; Serial link speed MUST match rosserial_python's serial_node.py baud arg
; in wheelchair_bringup/launch/hardware.launch.
monitor_speed = 115200

lib_deps =
    frankjoshua/Rosserial Arduino Library @ ^0.9.1
    ; Swap for your actual IMU part number/driver, e.g.:
    ; adafruit/Adafruit BNO055 @ ^1.6.3
    ; sparkfun/SparkFun MPU-9250 DMP Arduino Library @ ^1.2.9

build_flags =
    -D USB_SERIAL          ; Use USB CDC serial as the rosserial transport
    -D TEENSY_OPT_FASTEST   ; Favor control-loop determinism over code size
